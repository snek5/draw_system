# Flask + htmx draw app: run the test suite, including parity checks
# against the original React-era draw code (tests/parity).

trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Use Python 3.12'

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js (parity tests only)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements-dev.txt
    npm install --prefix tests/parity --no-audit --no-fund
  displayName: 'Install dependencies'

- script: python -m pytest -q
  displayName: 'Run tests'
